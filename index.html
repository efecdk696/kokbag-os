<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101713">
<meta name="description" content="EFE CIDIK INDUSTRIAL - KÖKBAĞ Edition">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>KÖKBAĞ OS | EFE CIDIK INDUSTRIAL</title>
<style>
:root{--bg:#0b100d;--panel:#121a15;--panel2:#17221b;--line:#26352b;--text:#e8f0e9;--muted:#91a197;--green:#9bc5a4;--green2:#416b4c;--gold:#c8ad72;--red:#df887d;--blue:#83a9c9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#1b2b20 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:#0d140f;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:25px}
.brand{padding:5px 10px}.brand-mark{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:800}.brand h1{font-size:23px;letter-spacing:2px;margin:7px 0 0}.brand p{margin:0;color:var(--muted);font-size:10px;letter-spacing:2px}
.nav-label{color:#718177;font-size:10px;letter-spacing:2px;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#aebdb2;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#1a2a1e;color:#eaf5ec;border-color:#2c4632}.nav .ico{width:20px;text-align:center;color:var(--green)}.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:15px 10px;color:var(--muted);font-size:11px}
main{padding:30px clamp(18px,4vw,54px);max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:30px}.eyebrow{font-size:10px;color:var(--gold);letter-spacing:2.4px;font-weight:700}.top h2{font-size:27px;margin:5px 0 0}.top-right{display:flex;align-items:center;gap:12px}.status{border:1px solid var(--line);padding:8px 12px;border-radius:30px;color:var(--green);font-size:12px}.avatar{width:38px;height:38px;border-radius:12px;background:#273b2b;border:1px solid #46614b;display:grid;place-items:center;font-weight:800;color:#d4e8d7}
.welcome{background:linear-gradient(115deg,#1b2d20,#152019 62%,#222b1e);border:1px solid #334938;border-radius:18px;padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden}.welcome:after{content:"K";position:absolute;right:35px;top:-60px;font-size:230px;font-weight:900;color:#ffffff08}.welcome h3{font-size:22px;margin:0 0 5px}.welcome p{color:#afc0b3;margin:0;max-width:600px}.welcome small{display:block;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 25px}.metric,.panel{background:linear-gradient(145deg,#151f19,#111813);border:1px solid var(--line);border-radius:15px}.metric{padding:17px}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin:7px 0 2px}.metric small{color:#8ca094;font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:12px}.section-head h3{margin:0;font-size:16px}.panel{padding:18px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick button{background:#18251c;border:1px solid #2c4031;border-radius:12px;padding:16px;color:var(--text);text-align:left}.quick button:hover{border-color:#6d9a75;background:#1c2d21}.quick b{display:block;margin-top:8px}.quick span{color:var(--muted);font-size:11px}
.btn{border:1px solid #466b4d;background:#294632;color:#eef8ef;padding:9px 14px;border-radius:9px;font-weight:650}.btn:hover{background:#365b3e}.btn.ghost{background:transparent;border-color:var(--line);color:#c6d2c9}.btn.danger{background:#3a211f;border-color:#6c3934;color:#f1c0b9}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:550px}.data-table th{text-align:left;color:#8fa094;font-size:11px;font-weight:600;letter-spacing:.6px;padding:12px;border-bottom:1px solid var(--line)}.data-table td{padding:13px 12px;border-bottom:1px solid #202c24;color:#d8e3da}.data-table tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:30px!important}.pill{display:inline-block;padding:3px 8px;border-radius:30px;background:#203526;color:#b9d8bf;font-size:11px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#aab9ae}.field input,.field select,.field textarea{width:100%;background:#0d1510;border:1px solid #304035;border-radius:9px;padding:11px;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#83ad8a}.modal-backdrop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{background:#121b15;border:1px solid #3a5140;border-radius:17px;width:min(560px,100%);padding:22px;max-height:90vh;overflow:auto;box-shadow:0 20px 70px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.close{background:transparent;color:var(--muted);border:0;font-size:24px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.note{color:var(--muted);font-size:12px;margin-top:12px}.settings-box{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.settings-box:last-child{border:0}.mobile-head{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:68px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);display:block}.brand,.nav-label,.side-foot{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{flex:1;display:flex;flex-direction:column;gap:1px;justify-content:center;padding:6px 2px;font-size:9px}.nav .ico{font-size:17px}.nav button span:last-child{white-space:nowrap}.main{padding-bottom:90px}main{padding:22px 15px 100px}.top{margin-bottom:20px}.top h2{font-size:22px}.status{display:none}.welcome{padding:20px}.welcome:after{right:0;font-size:150px}.cards{gap:9px}.metric{padding:13px}.metric strong{font-size:21px}.quick{gap:8px}.quick button{padding:12px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-mark">EFE CIDIK INDUSTRIAL</div><h1>KÖKBAĞ OS</h1><p>ORGANİK ÜRETİM YÖNETİMİ</p></div>
 <div><div class="nav-label">ANA MENÜ</div><nav class="nav" id="nav">
 <button class="active" data-page="dashboard"><span class="ico">⌂</span><span>Genel Bakış</span></button>
 <button data-page="products"><span class="ico">▦</span><span>Ürün & Stok</span></button>
 <button data-page="production"><span class="ico">⚙</span><span>Üretim</span></button>
 <button data-page="sales"><span class="ico">↗</span><span>Satış & Sipariş</span></button>
 <button data-page="customers"><span class="ico">♙</span><span>Müşteriler</span></button>
 <button data-page="finance"><span class="ico">₺</span><span>Finans</span></button>
 <button data-page="machines"><span class="ico">▤</span><span>Makine & Bakım</span></button>
 <button data-page="settings"><span class="ico">⚑</span><span>Ayarlar</span></button>
 </nav></div>
 <div class="side-foot">KÖKBAĞ EDITION V1.0<br>LOCAL WEB EDITION · 2026</div>
</aside>
<main>
 <header class="top"><div><div class="eyebrow">KÖKBAĞ ORGANİK / YÖNETİM PANELİ</div><h2 id="pageTitle">Genel Bakış</h2></div><div class="top-right"><span class="status">● Yerel kayıt aktif</span><div class="avatar">K</div></div></header>
 <div id="content"></div>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Yeni kayıt</h3><button class="close" id="closeModal">×</button></div><form id="recordForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Vazgeç</button><button class="btn" type="submit">Kaydet</button></div></form></div></div>
<script>
const storeKey='kokbag_os_web_v1';
const labels={products:'Ürün & Stok',production:'Üretim',sales:'Satış & Sipariş',customers:'Müşteriler',finance:'Finans',machines:'Makine & Bakım'};
const config={
 products:{title:'Ürün & Stok',add:'Ürün Ekle',fields:[['name','Ürün adı','text'],['category','Kategori','text'],['stock','Stok miktarı','number'],['unit','Birim','select','Adet;Kg;Litre;Kavanoz;Koli'],['price','Satış fiyatı (₺)','number']] ,cols:[['name','Ürün'],['category','Kategori'],['stock','Stok'],['unit','Birim'],['price','Fiyat']]},
 production:{title:'Üretim',add:'Üretim Kaydı Ekle',fields:[['product','Ürün','text'],['quantity','Üretim miktarı','number'],['unit','Birim','select','Adet;Kg;Litre;Kavanoz;Koli'],['date','Üretim tarihi','date'],['status','Durum','select','Planlandı;Devam ediyor;Tamamlandı']],cols:[['product','Ürün'],['quantity','Miktar'],['unit','Birim'],['date','Tarih'],['status','Durum']]},
 sales:{title:'Satış & Sipariş',add:'Satış Ekle',fields:[['customer','Müşteri','text'],['product','Ürün','text'],['quantity','Miktar','number'],['amount','Tutar (₺)','number'],['date','Tarih','date'],['status','Durum','select','Bekliyor;Hazırlanıyor;Tamamlandı']],cols:[['customer','Müşteri'],['product','Ürün'],['quantity','Miktar'],['amount','Tutar'],['date','Tarih'],['status','Durum']]},
 customers:{title:'Müşteriler',add:'Müşteri Ekle',fields:[['name','Ad / Firma','text'],['phone','Telefon','tel'],['email','E-posta','email'],['city','Şehir','text'],['note','Not','text']],cols:[['name','Ad / Firma'],['phone','Telefon'],['email','E-posta'],['city','Şehir']]},
 finance:{title:'Finans',add:'Finans Kaydı Ekle',fields:[['type','İşlem türü','select','Gelir;Gider'],['description','Açıklama','text'],['amount','Tutar (₺)','number'],['date','Tarih','date'],['category','Kategori','text']],cols:[['type','Tür'],['description','Açıklama'],['amount','Tutar'],['date','Tarih'],['category','Kategori']]},
 machines:{title:'Makine & Bakım',add:'Makine Ekle',fields:[['name','Makine adı','text'],['brand','Marka / Model','text'],['power','Güç / Özellik','text'],['lastService','Son bakım tarihi','date'],['note','Bakım notu','text']],cols:[['name','Makine'],['brand','Marka / Model'],['power','Özellik'],['lastService','Son bakım'],['note','Not']]}
};
let db=load(),current='dashboard';
function load(){try{return JSON.parse(localStorage.getItem(storeKey))||{}}catch(e){return {}}}
function save(){localStorage.setItem(storeKey,JSON.stringify(db))}
function arr(k){return db[k]||[]}
function money(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(Number(n)||0)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page){current=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('pageTitle').textContent=page==='dashboard'?'Genel Bakış':page==='settings'?'Ayarlar':labels[page];render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function render(){
 const el=document.getElementById('content');
 if(current==='dashboard'){const p=arr('products'),s=arr('sales'),f=arr('finance'),prod=arr('production');const income=f.filter(x=>x.type==='Gelir').reduce((a,x)=>a+(+x.amount||0),0),expense=f.filter(x=>x.type==='Gider').reduce((a,x)=>a+(+x.amount||0),0);
 el.innerHTML=`<section class="welcome"><small>EFE CIDIK INDUSTRIAL — KÖKBAĞ EDITION</small><h3>Üretimin ve işletmenin kontrolü.</h3><p>KÖKBAĞ operasyonlarını tek merkezden takip et. Kayıtlarını oluştur, düzenle ve işletmenin genel durumunu görüntüle.</p></section>
 <div class="cards"><div class="metric"><div class="label">Kayıtlı Ürün</div><strong>${p.length}</strong><small>Ürün kataloğu</small></div><div class="metric"><div class="label">Üretim Kaydı</div><strong>${prod.length}</strong><small>Üretim hareketleri</small></div><div class="metric"><div class="label">Satış Kaydı</div><strong>${s.length}</strong><small>Sipariş ve satışlar</small></div><div class="metric"><div class="label">Finansal Net</div><strong>${money(income-expense)}</strong><small>Girilen gelir − gider</small></div></div>
 <div class="section-head"><h3>Hızlı İşlemler</h3></div><div class="quick"><button onclick="go('products')">▦<b>Ürün ekle</b><span>Ürün ve stok kaydı</span></button><button onclick="go('production')">⚙<b>Üretim gir</b><span>Yeni üretim kaydı</span></button><button onclick="go('sales')">↗<b>Satış kaydet</b><span>Yeni satış işlemi</span></button><button onclick="go('finance')">₺<b>Finans ekle</b><span>Gelir veya gider</span></button></div>
 <div class="section-head"><h3>Son Kayıtlar</h3></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>MODÜL</th><th>AÇIKLAMA</th><th>DETAY</th></tr></thead><tbody>${recentRows()}</tbody></table></div></div>`;
 }else if(current==='settings'){el.innerHTML=`<div class="panel"><div class="settings-box"><div><b>Veri saklama</b><div class="note">Kayıtlar bu tarayıcının yerel hafızasında tutulur.</div></div><span class="pill">Local storage</span></div><div class="settings-box"><div><b>Yedek oluştur</b><div class="note">Kayıtlarını JSON dosyası olarak dışa aktar.</div></div><button class="btn" onclick="backup()">Yedeği indir</button></div><div class="settings-box"><div><b>Yedekten geri yükle</b><div class="note">Daha önce aldığın KÖKBAĞ yedeğini içe aktar.</div></div><button class="btn ghost" onclick="document.getElementById('restoreFile').click()">Dosya seç</button><input id="restoreFile" type="file" accept=".json,application/json" hidden onchange="restore(event)"></div><div class="settings-box"><div><b>Tüm verileri sil</b><div class="note">Bu işlem geri alınamaz. Önce yedek almanı öneririz.</div></div><button class="btn danger" onclick="clearData()">Verileri sil</button></div><p class="note">Bu geçici web sürümü tek cihaz / tek tarayıcı içindir. Tarayıcı verileri temizlenirse kayıtlar kaybolabilir. Düzenli yedek al.</p></div>`;
 }else{const c=config[current];const rows=arr(current);el.innerHTML=`<div class="section-head"><div><h3>${c.title} kayıtları</h3><div class="note">${rows.length} kayıt</div></div><div class="toolbar"><button class="btn" onclick="openForm('${current}')">＋ ${c.add}</button></div></div><div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr>${c.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>İŞLEM</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr>${c.cols.map(x=>`<td>${x[0]==='amount'||x[0]==='price'?money(r[x[0]]):safe(r[x[0]])}</td>`).join('')}<td><button class="btn ghost" onclick="editRecord('${current}',${i})">Düzenle</button> <button class="btn danger" onclick="deleteRecord('${current}',${i})">Sil</button></td></tr>`).join(''):`<tr><td class="empty" colspan="${c.cols.length+1}">Henüz kayıt yok. İlk kaydını ekleyebilirsin.</td></tr>`}</tbody></table></div></div><p class="note">Kayıtlar otomatik olarak bu cihazdaki tarayıcıya kaydedilir.</p>`}
}
function recentRows(){let all=[];for(const k of Object.keys(config)){arr(k).forEach(r=>all.push({k,r}))}all=all.slice(-5).reverse();return all.length?all.map(x=>`<tr><td>${labels[x.k]}</td><td>${safe(x.r.name||x.r.product||x.r.description||x.r.customer||'Yeni kayıt')}</td><td>${safe(x.r.date||x.r.status||'Kaydedildi')}</td></tr>`).join(''):'<tr><td class="empty" colspan="3">Henüz kayıt bulunmuyor. Hızlı işlemlerden başlayabilirsin.</td></tr>'}
let editing=null;
function openForm(k,index=null){editing=index===null?null:{k,index};const c=config[k],record=index===null?{}:arr(k)[index];document.getElementById('modalTitle').textContent=index===null?c.add:'Kaydı düzenle';document.getElementById('formFields').innerHTML=c.fields.map(([key,label,type,opts])=>`<div class="field ${key==='note'?'full':''}"><label>${label}</label>${type==='select'?`<select name="${key}" required><option value="">Seç</option>${opts.split(';').map(v=>`<option ${record[key]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" ${['name','product','quantity','amount'].includes(key)?'required':''} value="${safe(record[key]??(type==='date'?new Date().toISOString().slice(0,10):''))}" ${type==='number'?'min="0" step="any"':''}>`}</div>`).join('');document.getElementById('modal').classList.add('show')}
function editRecord(k,i){openForm(k,i)}
function deleteRecord(k,i){if(confirm('Bu kaydı silmek istediğine emin misin?')){db[k].splice(i,1);save();render()}}
document.getElementById('recordForm').addEventListener('submit',e=>{e.preventDefault();const k=editing?editing.k:current;const data=Object.fromEntries(new FormData(e.target).entries());if(editing)db[k][editing.index]=data;else{db[k]=arr(k);db[k].push(data)}save();closeModal();render()});
function closeModal(){document.getElementById('modal').classList.remove('show');editing=null}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kokbag-os-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||typeof parsed!=='object')throw Error();db=parsed;save();render();alert('Yedek başarıyla yüklendi.')}catch(err){alert('Dosya okunamadı veya geçerli bir KÖKBAĞ yedeği değil.')}};reader.readAsText(file)}
function clearData(){if(confirm('Tüm kayıtlar kalıcı olarak silinsin mi?')){db={};save();render()}}
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
